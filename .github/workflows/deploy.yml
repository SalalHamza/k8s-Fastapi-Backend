name: Deploy Backend to K8s

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-backend:latest

      - name: Deploy to K8s Master via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.K8S_MASTER_IP }}
          username: ${{ secrets.K8S_SSH_USER }}
          key: ${{ secrets.K8S_SSH_KEY }}
          port: 22
          script: |
            cat <<'EOF' | sed "s|DOCKERHUB_USERNAME|${{ secrets.DOCKERHUB_USERNAME }}|g" | kubectl apply -f -
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: fastapi-backend
              namespace: three-tier-app
            spec:
              replicas: 2
              selector:
                matchLabels:
                  app: backend
              template:
                metadata:
                  labels:
                    app: backend
                spec:
                  containers:
                    - name: backend
                      image: DOCKERHUB_USERNAME/fastapi-backend:latest
                      imagePullPolicy: Always
                      ports:
                        - containerPort: 8000
                      env:
                        - name: DATABASE_URL
                          value: "postgresql://dbuser:StrongPassword123@postgres-service.three-tier-app.svc.cluster.local:5432/userdb"
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: backend-service
              namespace: three-tier-app
            spec:
              type: NodePort
              ports:
                - port: 8000
                  targetPort: 8000
                  nodePort: 30008
              selector:
                app: backend
            EOF
            kubectl rollout restart deployment/fastapi-backend -n three-tier-app
            kubectl rollout status deployment/fastapi-backend -n three-tier-app --timeout=60s
