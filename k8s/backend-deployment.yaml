apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-backend
  namespace: three-tier-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: <YOUR_DOCKERHUB_USERNAME>/fastapi-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql://dbuser:StrongPassword123@postgres-service.three-tier-app.svc.cluster.local:5432/userdb"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: three-tier-app
spec:
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30008
  selector:
    app: backend
